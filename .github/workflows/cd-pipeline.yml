name: CI and CD Pipeline

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run project tests
        run: chmod +x ./gradlew && ./gradlew clean test build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy application
        run: echo "Application deployment successful!"
