
name: Artifact Download Practice

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create report
        run: |
          echo "Application build completed" > report.txt
          echo "Build successful" >> report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt

  download:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: build-report

      - name: Display downloaded report
        run: cat report.txt
