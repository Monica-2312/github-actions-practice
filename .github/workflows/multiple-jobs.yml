
name: Multiple Jobs Practice

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Start build
        run: echo "Build started"

      - name: Complete build
        run: echo "Build completed successfully"

  test:
    name: Test Job
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run test
        run: echo "Testing application"

      - name: Test result
        run: echo "All tests passed"

  deploy:
    name: Deploy Job
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy application
        run: echo "Application deployed successfully"
