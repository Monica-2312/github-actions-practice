name: GitHub Secrets Practice

on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret availability
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi
