
name: Artifacts Practice

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create report file
        run: |
          echo "GitHub Actions Practice Report" > report.txt
          echo "Build completed successfully" >> report.txt
          date >> report.txt

      - name: Display report
        run: cat report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: practice-report
          path: report.txt
